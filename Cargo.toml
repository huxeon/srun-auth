[package]
name = "srun-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha1 = "0.11.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
